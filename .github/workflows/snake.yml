
name: Generate Lavender Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate lavender contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: deyy13
          outputs: |
            dist/github-snake.svg?color_snake=%23c4b5fd&color_dots=%230d1117,%2331264b,%236d28d9,%23a78bfa,%23e9d5ff

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
